# Exemplo de configuração do Nginx para publicar o sistema em
# https://SEU-DOMINIO/vagas/
#
# Copie os dois blocos "location" para dentro do "server { ... }" do site
# do campus (ex.: /etc/nginx/sites-available/canguaretama).
# Ajuste os caminhos de /srv/vagas-litoral-sul se instalar em outro lugar.

# Arquivos estáticos (gerados pelo "python manage.py collectstatic")
location /vagas/static/ {
    alias /srv/vagas-litoral-sul/staticfiles/;
    expires 7d;
    access_log off;
}

# Aplicação Django (Gunicorn)
location /vagas/ {
    # A barra no final de "proxy_pass" REMOVE o prefixo /vagas antes de
    # repassar ao Django. O Django recoloca o prefixo nos links por causa
    # da variável FORCE_SCRIPT_NAME=/vagas.
    proxy_pass http://unix:/run/vagas-litoral-sul/gunicorn.sock:/;

    proxy_set_header Host $host;
    # IP real do visitante (usado no limite de envios do formulário).
    # Exige CONFIAR_PROXY_REVERSO=True no .env.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 1m;
}

# Redireciona /vagas (sem barra) para /vagas/
location = /vagas {
    return 301 /vagas/;
}
